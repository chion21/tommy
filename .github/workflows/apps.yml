name: build-apps
# Builds the Android APK and the Windows Setup.exe. Download them from the run's "Artifacts".
on:
  push: { paths: ["app/**", ".github/workflows/apps.yml"] }
  workflow_dispatch:

env:
  API_URL: ${{ vars.API_URL || '' }}  # empty = user types the server address on the login screen

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # creates android/ and windows/ folders the first time (keeps our lib/ code)
      - run: flutter create --platforms=android,windows --org com.tommyai --project-name tommy .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with: { name: tommy-android-apk, path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,windows --org com.tommyai --project-name tommy .
      - run: flutter pub get
      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols --dart-define=API_URL=${{ env.API_URL }}
      - name: Make Setup.exe with Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer\tommy.iss
      - uses: actions/upload-artifact@v4
        with: { name: tommy-windows-setup, path: app/build/installer/TommySetup.exe }

  # Puts the newest APK + Setup.exe on the repo's Releases page (easy to download on a phone).
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish "latest" release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mv dist/app-arm64-v8a-release.apk dist/Tommy.apk
          gh release delete latest -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create latest -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Tommy test build ($(date -u +%Y-%m-%d))" \
            --notes "Android: Tommy.apk · Windows: TommySetup.exe · build ${GITHUB_SHA::7}" \
            dist/Tommy.apk dist/TommySetup.exe
