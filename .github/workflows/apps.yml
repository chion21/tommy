name: build-apps
# Builds the Android APK and Windows Setup.exe, then puts both on Releases → "latest".
on:
  push: { paths: ["app/**", ".github/workflows/apps.yml"] }
  workflow_dispatch:

env:
  # Repository variables (Settings → Secrets and variables → Actions → Variables). Empty = feature off.
  DEFINES: >-
    --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
    --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
    --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
    --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,windows --org com.tommyai --project-name tommy .
      - run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build APK (signed with the fixed Tommy key when its password secret exists)
        env:
          TOMMY_KEYSTORE_PASSWORD: ${{ secrets.TOMMY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$TOMMY_KEYSTORE_PASSWORD" ]; then export TOMMY_KEYSTORE="$PWD/android_signing/tommy-release.p12"; echo "Using fixed release key"; else echo "::warning::TOMMY_KEYSTORE_PASSWORD secret missing — using a temporary debug key"; fi
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols $DEFINES
      - uses: actions/upload-artifact@v4
        with: { name: tommy-android-apk, path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,windows --org com.tommyai --project-name tommy .
      - run: python tool/patch_platforms.py
      - run: flutter pub get
      - shell: bash
        run: flutter build windows --release --obfuscate --split-debug-info=build/symbols $DEFINES
      - name: Make Setup.exe with Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer\tommy.iss
      - uses: actions/upload-artifact@v4
        with: { name: tommy-windows-setup, path: app/build/installer/TommySetup.exe }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish "latest" release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mv dist/app-arm64-v8a-release.apk dist/Tommy.apk
          gh release delete latest -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create latest -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Tommy test build ($(date -u +%Y-%m-%d))" \
            --notes "Android: Tommy.apk · Windows: TommySetup.exe · build ${GITHUB_SHA::7}" \
            dist/Tommy.apk dist/TommySetup.exe
