name: tommy
description: Tommy – Bangla voice AI assistant (Android + Windows)
publish_to: "none"
version: 0.9.0+9

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  google_sign_in: ^7.1.0
  url_launcher: ^6.3.1
  crypto: ^3.0.5
  record: ^6.2.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  flutter_soloud: ^5.0.0
  mqtt_client: ^10.5.1
  cryptography: ^2.7.0
  typed_data: ^1.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
